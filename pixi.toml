[workspace]
authors = ["anubhav-dogra <anubhavdograa@gmail.com>"]
channels = ["conda-forge", "https://prefix.dev/robostack-humble"]
name = "mujoco_sim"
platforms = ["linux-64"]
version = "0.1.0"

[activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/$(uname -i)-linux-gnu/pkgconfig:$CONDA_PREFIX/lib/pkgconfig"
MUJOCO_PATH = "$CONDA_PREFIX"

[tasks]
build = { cmd = [
  "bash", "-lc",
  "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_INCLUDE_PATH=$CONDA_PREFIX/include -DCMAKE_LIBRARY_PATH=$CONDA_PREFIX/lib"
] }

clean = { cmd = [
  "rm", "-rf",
  "$PIXI_PROJECT_ROOT/build",
  "$PIXI_PROJECT_ROOT/install",
  "$PIXI_PROJECT_ROOT/log",
] }

rebuild = { depends-on = ["clean", "build"] }

test = { cmd = [
  "bash", "-lc",
  "colcon test && colcon test-result --verbose"
] }

lint = { cmd = [
  "bash", "-lc",
  "pre-commit run --all-files"
] }

lint-changed = { cmd = [
  "bash", "-lc",
  "pre-commit run"
] }

sim_viewer_pendulum = { cmd = [
  "bash", "-lc",
  "\"$PIXI_PROJECT_ROOT/install/mujoco_viewer/lib/mujoco_viewer/mujoco_sim_viewer\" --config \"$PIXI_PROJECT_ROOT/mujoco_core/config/standalone/pendulum.yaml\""
] }

sim_viewer_double_pendulum = { cmd = [
  "bash", "-lc",
  "\"$PIXI_PROJECT_ROOT/install/mujoco_viewer/lib/mujoco_viewer/mujoco_sim_viewer\" --config \"$PIXI_PROJECT_ROOT/mujoco_core/config/standalone/double_pendulum.yaml\""
] }

[dependencies]
mujoco = ">=3.6.0,<4"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
glfw = ">=3.4,<4"
yaml-cpp = ">=0.8.0,<0.9"
opencv = ">=4.13.0,<5"
gtest = ">=1.17.0,<2"
clang-format = ">=22.1.3,<23"
pre-commit = ">=4.5.1,<5"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-humble-ament-cmake = ">=1.3.12,<2"
ros-humble-hardware-interface = ">=2.51.0,<3"
ros-humble-pluginlib = ">=5.1.0,<6"
ros-humble-rclcpp = ">=16.0.13,<17"
ros-humble-rclcpp-lifecycle = ">=16.0.13,<17"
